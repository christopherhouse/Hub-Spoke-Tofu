name: Deploy infrastructure

on:
  pull_request:
    branches: [main]
    paths:
      - 'infra/**'
      - 'bicepconfig.json'
      - '.github/workflows/deploy.yml'
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - 'bicepconfig.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# Entra workload identity federation. id-token is required to request the OIDC token;
# no client secret or storage key is ever used.
permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-infra-${{ github.ref }}
  cancel-in-progress: false

env:
  DEPLOYMENT_LOCATION: centralus

jobs:
  validate:
    name: Build and what-if
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build Bicep
        run: |
          az bicep build --file infra/main.bicep --stdout > /dev/null
          az bicep build-params --file infra/main.bicepparam --stdout > /dev/null

      - name: Azure login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: What-if
        run: |
          az deployment sub what-if \
            --name "infra-${{ github.run_id }}" \
            --location "$DEPLOYMENT_LOCATION" \
            --parameters infra/main.bicepparam

  deploy:
    name: Deploy
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Protected environment supplies the required reviewers gate.
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Azure login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy
        run: |
          az deployment sub create \
            --name "infra-${{ github.run_id }}" \
            --location "$DEPLOYMENT_LOCATION" \
            --parameters infra/main.bicepparam
