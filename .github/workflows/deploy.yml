name: Deploy infrastructure

on:
  pull_request:
    branches: [main]
    paths:
      - 'infra/**'
      - 'bicepconfig.json'
      - '.github/workflows/deploy.yml'
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - 'bicepconfig.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# Entra workload identity federation. id-token is required to request the OIDC token;
# no client secret or storage key is ever used.
permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-infra-${{ github.ref }}
  cancel-in-progress: false

env:
  DEPLOYMENT_LOCATION: centralus

jobs:
  validate:
    name: Build and what-if
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build Bicep
        run: |
          az bicep build --file infra/main.bicep --stdout > /dev/null
          az bicep build-params --file infra/main.bicepparam --stdout > /dev/null
          # Built but never deployed here. The bootstrap root creates the identity this
          # workflow authenticates as, so a human deploys it once, by hand. Building it keeps
          # it from rotting.
          az bicep build --file infra/bootstrap/main.bicep --stdout > /dev/null
          az bicep build-params --file infra/bootstrap/main.bicepparam --stdout > /dev/null

      - name: Azure login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: What-if
        run: |
          az deployment sub what-if \
            --name "infra-${{ github.run_id }}" \
            --subscription "${{ vars.AZURE_SUBSCRIPTION_ID }}" \
            --location "$DEPLOYMENT_LOCATION" \
            --parameters infra/main.bicepparam

  deploy:
    name: Deploy
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # The repository has a single environment; there is no dev/test/prod split. It carries no
    # required reviewers, so a merge to main deploys.
    environment: azure
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Azure login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # --subscription is passed explicitly rather than relying on the active context set by
      # azure/login. `az deployment sub create` targets whatever subscription is active, so an
      # unexpected context deploys a duplicate estate into the wrong subscription and reports
      # success. defaultSubscriptionId in main.bicepparam must agree with this value.
      - name: Deploy
        run: |
          az deployment sub create \
            --name "infra-${{ github.run_id }}" \
            --subscription "${{ vars.AZURE_SUBSCRIPTION_ID }}" \
            --location "$DEPLOYMENT_LOCATION" \
            --parameters infra/main.bicepparam
